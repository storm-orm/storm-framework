# The build logs warnings and errors only. The SQL log tests read the per-call summary, which Storm logs at info
# only while a test enables it.
org.slf4j.simpleLogger.log.st.orm.sql.perf=info
# The schema validation tests provoke findings on purpose. In fail mode the startup failure carries every finding,
# which the tests read from it.
org.slf4j.simpleLogger.log.st.orm.validation=off
