name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Rapid pushes to a PR queue duplicate runs; supersede them. Runs on main are
# keyed by commit instead of sharing a group: a shared group cancels the
# previously queued run even with cancel-in-progress off, and every main commit
# needs a completed run — for its coverage upload, and because the release
# workflow refuses to publish a commit without a successful CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Check formatting
        run: mvn spotless:check -B

      - name: Build and test
        run: mvn verify -B

      - name: Install Storm artifacts for the Gradle plugin smoke test
        run: mvn install -DskipTests -B

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test Gradle plugin
        id: gradle-plugin
        working-directory: storm-gradle-plugin
        run: ./gradlew build -Dstorm.smoke=true

      - name: Upload Gradle plugin test reports
        # A TestKit build that fails in its daemon leaves the reason in the daemon's log, which TestKit keeps
        # in the TestKit directory the functional test task sets.
        if: failure() && steps.gradle-plugin.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: gradle-plugin-test-reports
          path: |
            storm-gradle-plugin/build/reports/tests/
            storm-gradle-plugin/build/testkit/test-kit-daemon/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        # Dependabot-triggered runs receive no repository secrets, so the token is empty there and the
        # upload fails; skip it, the build and tests still gate the PR.
        if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # The aggregate report only: it holds every module's classes with the execution data of every
          # module's tests, so code that storm-java21, storm-kotlin or a dialect module exercises in
          # storm-core counts. The per-module reports would attribute none of that.
          files: storm-coverage/target/site/jacoco-aggregate/jacoco.xml
          disable_search: true
          flags: unittests
          fail_ci_if_error: true

  # Known-vulnerability gate over the dependency graph Storm ships (compile and runtime scope): the CycloneDX
  # bill of materials of the reactor, scanned by Trivy, failing on a High or Critical advisory. Test and provided
  # scope are the application's own dependencies and stay out of it. Trivy carries its own advisory database and
  # needs no key, so the gate runs on every PR, Dependabot's and forks' included.
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Write the bill of materials of the shipped dependency graph
        run: mvn -B -DskipTests -Dmaven.javadoc.skip=true -Dspotless.check.skip=true package org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom

      - name: Scan the bill of materials for known vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: sbom
          scan-ref: target/bom.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload the bill of materials
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-bom
          path: target/bom.json
          if-no-files-found: ignore
          retention-days: 30

  # The CLI ships to users via npx but is plain JavaScript with no compile step,
  # so at minimum its syntax must be checked before merge.
  cli-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Syntax-check the CLI
        run: node --check storm-cli/storm.mjs
