name: Release

on:
  push:
    tags:
      - 'v*'  # Only triggers on version tags like v1.2.0.

jobs:
  # The deploy below runs -DskipTests: a release ships exactly the bytes CI already
  # tested, it does not re-test them. That is only sound if the tagged commit in fact
  # passed CI, and publishing is irreversible, so every publish job is gated on a
  # successful CI run for this commit. A tag pushed while CI is still running waits
  # for the verdict instead of failing.
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # CI itself may take up to an hour; leave room to wait for it.
    permissions:
      contents: read
      actions: read   # Reading workflow runs requires it.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require a successful CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # For annotated tags GITHUB_SHA is the tag object, not the commit, so
          # resolve the commit the tag points at.
          COMMIT=$(git rev-parse HEAD^{commit})
          RUNS_API="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs"
          while true; do
            SUCCESSFUL=$(gh api "${RUNS_API}?head_sha=${COMMIT}&status=success" --jq '.total_count')
            if [ "${SUCCESSFUL}" -gt 0 ]; then
              echo "CI passed for ${COMMIT}."
              exit 0
            fi
            ACTIVE=$(gh api "${RUNS_API}?head_sha=${COMMIT}" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "${ACTIVE}" -gt 0 ]; then
              echo "CI is still running for ${COMMIT}; checking again in 60s."
              sleep 60
              continue
            fi
            echo "::error::No successful CI run exists for ${COMMIT}. Re-run CI for this commit (or push it through CI), then re-run this workflow."
            exit 1
          done

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: verify-ci
    permissions:
      contents: read   # Checkout only; deploy auth comes from Central/GPG secrets, not GITHUB_TOKEN.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Signing and Central credentials are configured explicitly in the steps
      # below rather than through setup-java inputs: the action's server-username/
      # server-password expect environment variable *names*, and its generated
      # settings.xml is replaced wholesale here anyway.
      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --yes --import
          gpg --list-keys

      - name: Set GPG_TTY for batch mode
        run: echo "GPG_TTY=$(tty)" >> $GITHUB_ENV

      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.CENTRAL_USERNAME }}</username>
                <password>${{ secrets.CENTRAL_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish all modules to Maven Central
        # The version comes from the tag: -Drevision overrides the ${revision} property and the
        # flatten-maven-plugin (resolveCiFriendliesOnly) writes it into the published poms. No manual pom bump needed.
        run: mvn clean deploy -Prelease -Drevision="${{ steps.version.outputs.VERSION }}" -Dgpg.passphrase="${GPG_PASSPHRASE}" -DskipTests -B
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm versions cannot be reused after an unpublish, so the CLI must only go out
    # once the Central deploy has succeeded; otherwise a failed deploy burns the npm
    # version number on a release whose artifacts do not exist.
    needs: publish
    permissions:
      id-token: write   # Required for npm trusted publishing (OIDC).
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set package version from tag
        run: |
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
          # The stamp is anchored to this exact source line; without the guard, a refactor
          # that renames it would silently publish a stale VERSION.
          grep -q "^const VERSION = '" storm.mjs
          sed -i "s/const VERSION = '.*'/const VERSION = '${{ steps.version.outputs.VERSION }}'/" storm.mjs
        working-directory: storm-cli

      - name: Publish to npm
        run: npm publish --access public
        working-directory: storm-cli
        # Authentication is handled via OIDC trusted publishing — no NPM_TOKEN needed.
        # Configure the trusted publisher on npmjs.com: @storm-orm/cli > Settings >
        # Trusted Publisher (repo: storm-orm/storm-framework, workflow: release.yml).

  publish-gradle-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The plugin references st.orm artifacts of the same version on Central. The
    # publish job blocks until Central has validated and published them (the pom
    # sets waitUntil=published), so they are resolvable when this job starts.
    needs: publish
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish to the Gradle Plugin Portal
        working-directory: storm-gradle-plugin
        run: ./gradlew publishPlugins -Pversion="${{ steps.version.outputs.VERSION }}"
        # The first publication of the st.orm plugin id must be done manually: new ids go
        # through a manual Portal review that can take days, and a release tag must never
        # hang on that. Credentials come from an API key created on plugins.gradle.org.
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

  version-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create docs version
        run: npx docusaurus docs:version ${{ steps.version.outputs.VERSION }}
        working-directory: website

      # The README is served raw by GitHub (no @@STORM_VERSION@@ substitution),
      # so its install snippets carry a literal version. Sync it to the release
      # here, in the same commit as the docs snapshot, so it is never bumped by
      # hand. Targets the Gradle plugin version and the storm-bom coordinate in
      # both the Gradle and Maven examples; the Maven <version> substitution is
      # anchored to the line after the storm-bom <artifactId> so that any other
      # XML snippet the README picks up is left alone.
      - name: Sync README version
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          sed -i -E \
            -e "s/(id\(\"st\.orm\"\) version \")[0-9]+\.[0-9]+\.[0-9]+/\1${V}/g" \
            -e "s/(storm-bom:)[0-9]+\.[0-9]+\.[0-9]+/\1${V}/g" \
            -e "/<artifactId>storm-bom<\/artifactId>/{n;s#(<version>)[0-9]+\.[0-9]+\.[0-9]+(</version>)#\1${V}\2#;}" \
            README.md
          # Without these guards, a README edit that drifts away from the patterns
          # above would silently ship snippets pinning the previous release.
          grep -q "id(\"st.orm\") version \"${V}\"" README.md
          grep -q "storm-bom:${V}" README.md
          grep -q "<version>${V}</version>" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: snapshot version ${{ steps.version.outputs.VERSION }}"
          git push

  # The storm-template-* starter templates and the storm-example-* applications are
  # GitHub template repositories. Keep the Storm version they pin current, so that
  # "Use this template" and a fresh clone always start on the release.
  sync-template-repos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish-gradle-plugin
    # Pushes go through RELEASE_TOKEN, not the default GITHUB_TOKEN, so this job
    # needs no permissions on its own repository.
    permissions: {}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # These build files pin the st.orm Gradle plugin version; the Storm artifacts
      # themselves are managed by the plugin's BOM, so only that coordinate needs
      # bumping. Toolchain versions (Kotlin, Ktor, Spring Boot) track their own
      # upstreams and are left untouched. RELEASE_TOKEN must have write access to
      # each storm-orm repository listed below, starter templates included.
      - name: Bump the st.orm plugin version in each template and example
        # The repos are a post-release convenience: by the time this job runs
        # the release artifacts are already on Central, npm and the Plugin Portal,
        # so a failed sync must not mark the release run red. Failures surface as
        # warning annotations on the run and the step exits non-zero so the repos
        # that still need a manual bump are visible in the job log.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          # Called from a conditional, so errexit is suppressed inside the body;
          # every step chains an explicit `|| return 1` to keep a failure (a 403
          # on push, a renamed build file) from being masked by later commands.
          sync_repo() {
            local repo="$1"
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/storm-orm/${repo}.git" "$repo" || return 1
            # Replace the whole quoted version so any -SNAPSHOT/-rc suffix is dropped
            # and the template pins the exact release.
            sed -i -E "s/(id\(\"st\.orm\"\) version \")[^\"]*(\")/\1${V}\2/g" "$repo/build.gradle.kts" || return 1
            # Same guard as the README sync: a template whose plugin line drifts
            # from the pattern would otherwise silently stay on the old release.
            grep -q "id(\"st.orm\") version \"${V}\"" "$repo/build.gradle.kts" || return 1
            git -C "$repo" config user.name "github-actions[bot]" || return 1
            git -C "$repo" config user.email "github-actions[bot]@users.noreply.github.com" || return 1
            if git -C "$repo" diff --quiet; then
              echo "${repo}: already on ${V}"
            else
              git -C "$repo" commit -aqm "chore: bump Storm to ${V}" || return 1
              git -C "$repo" push || return 1
            fi
          }
          FAILED=()
          # Starter templates first: they are what a new project begins as, so a
          # partial failure should leave them synced rather than the demos.
          for repo in \
            storm-template-kotlin-ktor \
            storm-template-kotlin-spring-boot \
            storm-template-java-spring-boot \
            storm-example-java-spring-boot-4 \
            storm-example-kotlin-spring-boot-4 \
            storm-example-kotlin-spring-boot-4-graalvm \
            storm-example-kotlin-ktor \
            storm-example-kotlin-ktor-graalvm; do
            if ! sync_repo "$repo"; then
              echo "::warning::Failed to sync ${repo} to ${V}. Bump build.gradle.kts there manually or re-run this job."
              FAILED+=("$repo")
            fi
          done
          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::warning::Release ${V} itself succeeded, but ${#FAILED[@]} template or example repo(s) were not synced: ${FAILED[*]}"
            exit 1
          fi
