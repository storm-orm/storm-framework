# Watches the dependency surfaces that previously drifted unwatched: the Maven
# build (Spring Boot, Kotlin, hardcoded tool versions), the workflow actions,
# and the two npm trees (website, CLI). Monthly cadence keeps the PR noise low.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Each compiler plugin variant compiles against the first release of its Kotlin generation, with the
    # kotlin-compile-testing release built for that compiler, so its plugin runs on every later patch release.
    # Those pins move only when a variant is added.
    exclude-paths:
      - "storm-compiler-plugin/kotlin-*/pom.xml"
    ignore:
      # The build compiles and tests against the oldest Spring Boot line Storm supports, so an API that only a
      # newer major has cannot slip into the Spring modules. Moving to a new major is a decision of its own, taken
      # when support for the current one ends; minor and patch updates within the line are still proposed.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      # The same holds for Kotlin: the build compiles with the oldest Kotlin line Storm supports, and the kotlinx
      # libraries and KSP are the ones built for that line, since a newer one brings a newer standard library to
      # every application. They move together, when the Kotlin floor does; kotlinx and KSP patches are still proposed.
      # The root is on the final 2.0 patch, and storm-ktor and storm-ktor-test override kotlin.version for the Ktor
      # toolchain, which Dependabot reads as the root's property; a patch for either would move both.
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlinx:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.devtools.ksp:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # storm-ktor compiles against the oldest Ktor line it supports. A newer line brings its own kotlinx-coroutines
      # requirement to every application, so the Ktor floor moves as a decision of its own.
      - dependency-name: "io.ktor:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # storm-jackson2 supports Jackson 2.17 and later and compiles against 2.17, so a newer API cannot slip in.
      - dependency-name: "com.fasterxml.jackson.core:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # storm-jackson3 likewise supports Jackson 3.0 and later and compiles against 3.0.
      - dependency-name: "tools.jackson.core:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Storm's GraalVM Feature runs inside the application's native-image builder, so it compiles against the
      # oldest GraalVM line Storm supports.
      - dependency-name: "org.graalvm.sdk:*"
        update-types: ["version-update:semver-major"]
      # Storm's own artifacts: the reactor's version comes from ${revision} at build time.
      - dependency-name: "st.orm:*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Docusaurus refuses to build when its core and plugins differ in version, so they move together.
      docusaurus:
        patterns:
          - "@docusaurus/*"
    ignore:
      # Nothing in the site build runs the TypeScript compiler, so a new major line is taken deliberately.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /storm-cli
    schedule:
      interval: monthly
